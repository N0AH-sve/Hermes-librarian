# Exemple de configuration. Ne contient que des valeurs factices : le jeton reel
# arrive par l'environnement (GK_BRIDGE_TOKEN), jamais par ce fichier.
#
# Toute cle peut etre surchargee par GK_<CLE_EN_MAJUSCULES>, qui a le dernier mot.

database: /var/lib/gk/gk.db
patterns: /etc/gk/motifs.yaml

# La racine que GK demandera au pont de parcourir -- nommee explicitement, et
# jamais une decouverte large : le volume de l'agent contient des instantanes et
# des profils dupliques, qu'un parcours trop large indexerait comme des doublons.
#
# GK ne lit PAS ce chemin lui-meme : il n'a pas le volume de l'agent monte, c'est
# tout l'objet de la conception par push. La valeur est declaree ici pour qu'il
# n'existe qu'une seule source de verite, et transmise au pont.
skills_root: /opt/data/skills

# Boucle locale uniquement. L'agent tourne en network_mode: host, donc aucun nom
# de service bridge n'est resoluble et le plugin vise 127.0.0.1.
host: 127.0.0.1
port: 8765
bridge_path: /mcp/bridge
agent_path: /mcp/agent

# Volontairement VIDES. Un marque-place ici deviendrait un jeton reel si la
# variable d'environnement manquait — et celui-la serait publie sur GitHub.
# Vide, l'absence est bruyante : au demarrage, dans /health et dans `gk check`.
bridge_token: ""
agent_token: ""
discord_webhook: ""

log_level: INFO
