# Lexique francais de l'optimiseur. Rechargeable a chaud.
#
# Son role n'est PAS de corriger l'orthographe de l'utilisateur pour la beaute
# du geste : c'est de rendre une demande mal tapee comparable au vocabulaire
# des skills, pour que la recherche de la phase 2 trouve « récapitulatif »
# quand le message dit « recapitulatif ». Le message de l'utilisateur n'est
# jamais reecrit : la lecture corrigee est ajoutee a cote.
#
# Quatre sections :
#
#   abreviations  raccourcis et SMS, remplaces par leur forme longue. C'est la
#                 section qui rapporte le plus : « maj », « bdd », « pb » ne
#                 ressemblent a rien dans un index plein texte.
#   fautes        fautes frequentes a correction unique et sure.
#   proteges      mots que l'optimiseur ne touche jamais, meme s'ils ressemblent
#                 a une faute : noms propres, outils, jargon maison.
#   mots          le vocabulaire de reference, accentue. Il sert a deux choses :
#                 restaurer les accents manquants (la faute n'1 en francais
#                 tape vite), et fournir les candidats a distance 1.
#
# Ce lexique est court a dessein, et c'est une limite assumee : le vocabulaire
# qui compte vraiment est celui des 537 skills, et il arrivera avec l'index de
# la phase 2 (`Lexique.ajouter_vocabulaire`). D'ici la, les sections
# `abreviations` et `fautes` font l'essentiel du travail, parce qu'elles ne
# dependent d'aucun corpus.
#
# Regles de prudence cablees dans le code, pas ici : aucun mot contenant un
# chiffre, un underscore, une majuscule interne, ni rien entre backticks,
# guillemets, dans une URL ou dans un chemin n'est jamais corrige. Une
# correction ambigue (deux candidats a distance 1) est abandonnee plutot que
# devinee.

