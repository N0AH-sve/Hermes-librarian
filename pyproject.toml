[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenknowledge"
version = "0.1.0"
description = "Un bibliothecaire pour Hermes Agent : choix de skills, faits sources, et ce qui reste a verifier"
requires-python = ">=3.11"
# Volontairement court. Chaque dependance est une dette de mise a jour sur un
# serveur cense tourner sans surveillance, et le chemin de service n'appelle
# aucune API externe.
# uvicorn est epingle explicitement : le serveur l'appelle directement pour
# pouvoir intercaler la verification du jeton, donc en dependre transitivement
# serait fragile.
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
# snowballstemmer arrive en phase 2, avec la recherche.
dev = ["pytest>=8", "pyyaml"]  # pyyaml seulement pour tester brancher-gk.py

[project.scripts]
gk = "gk.cli:main"

[tool.setuptools]
package-dir = {"" = "server"}

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
