[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenknowledge"
version = "0.1.0"
description = "Un bibliothecaire pour Hermes Agent : choix de skills, faits sources, et ce qui reste a verifier"
requires-python = ">=3.11"
# Volontairement court. Chaque dependance est une dette de mise a jour sur un
# serveur cense tourner sans surveillance, et le chemin de service n'appelle
# aucune API externe.
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
# snowballstemmer arrive en phase 2, avec la recherche.
dev = ["pytest>=8"]

[project.scripts]
gk = "gk.cli:main"

[tool.setuptools]
package-dir = {"" = "server"}

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
